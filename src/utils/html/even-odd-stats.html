<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Thống Kê Tài Xỉu – Play Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121824;
            --bg-card: #182235;
            --border: #24344f;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-blue: #0284c7;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --glow: 0 0 15px rgba(2, 132, 199, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--glow);
        }
        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .page-header p { color: var(--text-secondary); font-size: 0.95rem; }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        .toolbar select {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            padding: 6px 12px;
            font-family: inherit;
        }
        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .btn:hover { filter: brightness(1.1); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }
        .stat-card .val { font-size: 1.6rem; font-weight: 800; color: #38bdf8; margin-top: 6px; }
        .stat-card .lbl { font-size: 0.8rem; color: var(--text-secondary); }

        .session-table-wrap {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .section-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
            font-weight: 700;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; font-size: 0.85rem; text-align: left; }
        th { background: var(--bg-card); color: var(--text-secondary); font-weight: 600; border-bottom: 1px solid var(--border); }
        td { border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(24, 34, 53, 0.5); }

        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }
        .badge-tai { background: rgba(239, 115, 22, 0.2); color: var(--accent-orange); border: 1px solid rgba(239, 115, 22, 0.4); }
        .badge-xiu { background: rgba(2, 132, 199, 0.2); color: var(--accent-blue); border: 1px solid rgba(2, 132, 199, 0.4); }
        .badge-win { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.4); }
        .badge-loss { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.4); }
        .badge-no-bet { background: rgba(148, 163, 184, 0.2); color: var(--text-secondary); border: 1px solid rgba(148, 163, 184, 0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>📊 Thống Kê Tài Xỉu</h1>
            <p>Báo cáo lịch sử phiên cược Tài Xỉu của bot tự động</p>
        </div>

        <div class="toolbar">
            <select id="limitSelect" onchange="loadHistory()">
                <option value="20">20 phiên gần nhất</option>
                <option value="50" selected>50 phiên</option>
                <option value="100">100 phiên</option>
                <option value="200">200 phiên</option>
            </select>
            <button class="btn" onclick="loadHistory()">🔄 Tải Lại</button>
            <span style="margin-left: auto; font-size: 0.85rem; color: var(--text-secondary);" id="totalCount">Tổng: 0 phiên</span>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="lbl">Tỉ lệ Tài / Xỉu</div>
                <div class="val" id="taiXiuRatio">0 / 0</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Số ván Bot cược</div>
                <div class="val" id="botBetCount">0</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Số ván Bot Thắng</div>
                <div class="val" id="botWinCount">0</div>
            </div>
            <div class="stat-card">
                <div class="lbl">Tỉ lệ Thắng (Win Rate)</div>
                <div class="val" id="botWinRate">0%</div>
            </div>
        </div>

        <div class="session-table-wrap">
            <div class="section-header">📋 Lịch Sử Phiên</div>
            <div id="tableBody">
                <table>
                    <thead>
                        <tr>
                            <th>Phiên (GID)</th>
                            <th>Thời gian</th>
                            <th>Kết quả</th>
                            <th>Điểm</th>
                            <th>Xúc Xắc</th>
                            <th>Bot cược</th>
                            <th>Tiền cược</th>
                            <th>Trạng thái Bot</th>
                            <th>Số dư ví</th>
                        </tr>
                    </thead>
                    <tbody id="historyList">
                        <!-- Tải bằng JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_HISTORY = 'http://localhost:3001/api/even-odd/session-history';

        document.addEventListener('DOMContentLoaded', () => {
            loadHistory();
        });

        async function loadHistory() {
            const limit = document.getElementById('limitSelect').value;
            try {
                const res = await fetch(`${API_HISTORY}?limit=${limit}`);
                if (res.ok) {
                    const data = await res.json();
                    renderStats(data);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderStats(data) {
            document.getElementById('totalCount').textContent = `Tổng: ${data.length} phiên`;

            let taiCount = 0;
            let xiuCount = 0;
            let betCount = 0;
            let winCount = 0;

            const tbody = document.getElementById('historyList');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align: center; color: var(--text-secondary);">Chưa có phiên nào được ghi nhận.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(item => {
                const isTai = item.result && item.result.startsWith('TAI');
                if (item.result) {
                    if (isTai) taiCount++; else xiuCount++;
                }

                let botBetLabel = '—';
                let botBetAmount = '—';
                let botStatusBadge = '<span class="badge badge-no-bet">Không cược</span>';

                if (item.botBet && item.botBet.choice) {
                    betCount++;
                    botBetLabel = item.botBet.choice;
                    botBetAmount = item.botBet.amount ? item.botBet.amount.toLocaleString('vi-VN') + ' đ' : '—';
                    if (item.botBet.won) {
                        winCount++;
                        botStatusBadge = '<span class="badge badge-win">THẮNG</span>';
                    } else {
                        botStatusBadge = '<span class="badge badge-loss">THUA</span>';
                    }
                }

                const timeStr = item.endedAt ? new Date(item.endedAt).toLocaleTimeString('vi-VN') : '—';
                const resBadge = isTai ? '<span class="badge badge-tai">TAI</span>' : '<span class="badge badge-xiu">XIU</span>';
                const sumResult = item.dices ? item.dices.reduce((a,b)=>a+b, 0) : '—';

                return `
                    <tr>
                        <td style="font-weight: 700;">#${item.gid || '—'}</td>
                        <td>${timeStr}</td>
                        <td>${resBadge}</td>
                        <td style="font-weight: 600;">${sumResult} điểm</td>
                        <td><code>[${item.dices ? item.dices.join(', ') : ''}]</code></td>
                        <td><span class="badge ${item.botBet && item.botBet.choice === 'TAI' ? 'badge-tai' : 'badge-xiu'}">${botBetLabel}</span></td>
                        <td style="color: var(--accent-orange); font-weight: 600;">${botBetAmount}</td>
                        <td>${botStatusBadge}</td>
                        <td style="color: var(--accent-green); font-weight: 600;">${item.budget ? item.budget.toLocaleString('vi-VN') + ' đ' : '—'}</td>
                    </tr>
                `;
            }).join('');

            document.getElementById('taiXiuRatio').textContent = `${taiCount}T / ${xiuCount}X`;
            document.getElementById('botBetCount').textContent = betCount;
            document.getElementById('botWinCount').textContent = winCount;
            const rate = betCount > 0 ? ((winCount / betCount) * 100).toFixed(1) + '%' : '0%';
            document.getElementById('botWinRate').textContent = rate;
        }
    </script>
</body>
</html>
