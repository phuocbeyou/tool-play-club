<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ Cấu Hình Tài Xỉu – Play Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121824;
            --bg-card: #182235;
            --border: #24344f;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-blue: #0284c7;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --glow: 0 0 15px rgba(2, 132, 199, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--glow);
        }
        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .page-header p { color: var(--text-secondary); font-size: 0.95rem; }

        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .section h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            color: #38bdf8;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
        }
        .form-group input[type="checkbox"] {
            width: auto;
            margin-right: 10px;
            transform: scale(1.2);
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-weight: 600;
            cursor: pointer;
            margin-top: 25px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s;
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-success { background: var(--accent-green); }
        .btn-success:hover { background: #16a34a; transform: translateY(-2px); }
        .btn-primary { background: var(--accent-blue); }
        .btn-primary:hover { background: #0284c7; transform: translateY(-2px); }
        .btn-danger { background: var(--accent-red); }
        .btn-danger:hover { background: #dc2626; }

        .rules-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .rules-table th, .rules-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .rules-table th {
            background: var(--bg-card);
            color: var(--text-secondary);
            font-weight: 700;
        }
        .rules-table tr:hover td {
            background: rgba(24, 34, 53, 0.5);
        }

        .status-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }
        .status-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .rule-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-active { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-inactive { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-choice { background: rgba(2, 132, 199, 0.15); color: #38bdf8; border: 1px solid rgba(2, 132, 199, 0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>⚙️ Cấu Hình Tài Xỉu</h1>
            <p>Thiết lập cược, quản lý quy tắc và công thức gấp thếp Tài Xỉu</p>
        </div>

        <div id="statusMessage" class="status-message"></div>

        <div class="section">
            <h2>🎮 Cài Đặt Trò Chơi</h2>
            <div class="settings-grid">
                <div class="form-group">
                    <label for="betAmount">Mức cược mặc định (đ):</label>
                    <input type="number" id="betAmount" value="5000">
                </div>
                <div class="form-group">
                    <label for="jackpotThreshold">Ngưỡng hũ tối thiểu (đ):</label>
                    <input type="number" id="jackpotThreshold" value="10000000">
                </div>
                <div class="form-group">
                    <label for="betStop">Số dư tối thiểu để dừng cược (đ):</label>
                    <input type="number" id="betStop" value="10000">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="isMartingale"> Gấp thếp (Martingale)
                    </label>
                </div>
                <div class="form-group">
                    <label for="rateMartingale">Hệ số nhân gấp thếp:</label>
                    <input type="number" id="rateMartingale" step="0.1" value="2.0">
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="zombie"> Zombie Mode (Chạy vô hạn)
                    </label>
                </div>
                <div class="form-group">
                    <label for="countdownTime">Thời gian đếm ngược đặt cược (giây):</label>
                    <input type="number" id="countdownTime" value="37">
                </div>
                <div class="form-group">
                    <label for="winStop">Mục tiêu thắng dừng cược (đ):</label>
                    <input type="number" id="winStop" value="200000">
                </div>
                <div class="form-group">
                    <label for="lossStop">Giới hạn thua dừng cược (đ):</label>
                    <input type="number" id="lossStop" value="100000">
                </div>
            </div>
            <button class="btn btn-primary" onclick="saveGameSettings()">💾 Lưu Cài Đặt</button>
        </div>

        <div class="section">
            <h2>📜 Quy Tắc Đặt Cược</h2>
            
            <div style="background: var(--bg-card); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border);">
                <h3 style="font-size: 1rem; margin-bottom: 15px; color: #38bdf8;">Thêm / Cập Nhật Quy Tắc</h3>
                <input type="hidden" id="editRuleId">
                <div class="settings-grid">
                    <div class="form-group">
                        <label for="ruleName">Tên quy tắc:</label>
                        <input type="text" id="ruleName" placeholder="Ví dụ: Cầu Tài 3 ván">
                    </div>
                    <div class="form-group">
                        <label for="rulePattern">Pattern (Cách nhau bằng dấu phẩy):</label>
                        <input type="text" id="rulePattern" placeholder="Ví dụ: TAI,TAI,TAI">
                    </div>
                    <div class="form-group">
                        <label for="ruleBetOn">Đặt cược vào:</label>
                        <select id="ruleBetOn">
                            <option value="TAI">TAI</option>
                            <option value="XIU">XIU</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rulePriority">Độ ưu tiên (Càng nhỏ càng ưu tiên trước):</label>
                        <input type="number" id="rulePriority" value="10">
                    </div>
                    <div class="form-group">
                        <label for="ruleBetAmount">Mức cược riêng (đ):</label>
                        <input type="number" id="ruleBetAmount" placeholder="Bỏ trống nếu lấy mặc định">
                    </div>
                    <div class="form-group">
                        <label for="ruleDescription">Mô tả quy tắc:</label>
                        <input type="text" id="ruleDescription" placeholder="Mô tả công thức">
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="ruleActive" checked> Kích hoạt
                        </label>
                    </div>
                </div>
                <button class="btn btn-success" onclick="addOrUpdateRule()">➕ Lưu Quy Tắc</button>
                <button class="btn btn-danger" style="background: #64748b;" onclick="resetRuleForm()">Clear Form</button>
            </div>

            <table class="rules-table">
                <thead>
                    <tr>
                        <th>Tên quy tắc</th>
                        <th>Pattern</th>
                        <th>Cược</th>
                        <th>Tiền cược</th>
                        <th>Ưu tiên</th>
                        <th>Mô tả</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody id="rulesList">
                    <!-- Load bằng JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let config = {};
        const API_URL = 'http://localhost:3000/api/config/even-odd';

        document.addEventListener('DOMContentLoaded', () => {
            loadConfig();
        });

        async function loadConfig() {
            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    config = await res.json();
                    renderConfig();
                }
            } catch (err) {
                showStatus('Lỗi tải cấu hình: ' + err.message, 'error');
            }
        }

        function renderConfig() {
            const gs = config.gameSettings || {};
            document.getElementById('betAmount').value = gs.BET_AMOUNT || 5000;
            document.getElementById('jackpotThreshold').value = gs.JACKPOT_THRESHOLD || 10000000;
            document.getElementById('betStop').value = gs.BET_STOP || 10000;
            document.getElementById('isMartingale').checked = gs.IS_MARTINGALE || false;
            document.getElementById('rateMartingale').value = gs.RATE_MARTINGALE || 2.0;
            document.getElementById('zombie').checked = gs.ZOMBIE || false;
            document.getElementById('countdownTime').value = gs.COUNTDOWN_TIME || 37;
            document.getElementById('winStop').value = gs.WIN_STOP || 200000;
            document.getElementById('lossStop').value = gs.LOSS_STOP || 100000;

            renderRules();
        }

        function renderRules() {
            const tbody = document.getElementById('rulesList');
            const rules = config.bettingRules || [];
            
            if (rules.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-secondary);">Chưa cấu hình quy tắc nào.</td></tr>';
                return;
            }

            tbody.innerHTML = rules.map((r, idx) => `
                <tr>
                    <td style="font-weight: 600;">${r.name}</td>
                    <td><code>[${r.pattern ? r.pattern.join(', ') : ''}]</code></td>
                    <td><span class="rule-badge badge-choice">${r.betOn}</span></td>
                    <td>${r.betAmount ? r.betAmount.toLocaleString('vi-VN') + ' đ' : 'Mặc định'}</td>
                    <td>${r.priority}</td>
                    <td>${r.description || ''}</td>
                    <td><span class="rule-badge ${r.active ? 'badge-active' : 'badge-inactive'}">${r.active ? 'Hoạt động' : 'Tắt'}</span></td>
                    <td>
                        <button class="btn btn-primary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="editRule('${r.id}')">✏️ Sửa</button>
                        <button class="btn btn-danger" style="padding: 4px 8px; font-size: 0.75rem;" onclick="deleteRule('${r.id}')">🗑️ Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        async function saveConfigToServer() {
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });
                if (res.ok) {
                    showStatus('Đã cập nhật cấu hình Tài Xỉu thành công!', 'success');
                    return true;
                }
            } catch (err) {
                showStatus('Lỗi lưu cấu hình: ' + err.message, 'error');
            }
            return false;
        }

        async function saveGameSettings() {
            config.gameSettings = {
                BET_AMOUNT: parseInt(document.getElementById('betAmount').value) || 5000,
                JACKPOT_THRESHOLD: parseInt(document.getElementById('jackpotThreshold').value) || 10000000,
                BET_STOP: parseInt(document.getElementById('betStop').value) || 10000,
                TIME_SEND_MESS: 1,
                IS_MARTINGALE: document.getElementById('isMartingale').checked,
                RATE_MARTINGALE: parseFloat(document.getElementById('rateMartingale').value) || 2.0,
                ZOMBIE: document.getElementById('zombie').checked,
                COUNTDOWN_TIME: parseInt(document.getElementById('countdownTime').value) || 37,
                WIN_STOP: parseInt(document.getElementById('winStop').value) || 200000,
                LOSS_STOP: parseInt(document.getElementById('lossStop').value) || 100000
            };
            await saveConfigToServer();
        }

        function editRule(id) {
            const rule = config.bettingRules.find(r => r.id === id);
            if (rule) {
                document.getElementById('editRuleId').value = rule.id;
                document.getElementById('ruleName').value = rule.name;
                document.getElementById('rulePattern').value = rule.pattern ? rule.pattern.join(',') : '';
                document.getElementById('ruleBetOn').value = rule.betOn;
                document.getElementById('rulePriority').value = rule.priority;
                document.getElementById('ruleBetAmount').value = rule.betAmount || '';
                document.getElementById('ruleDescription').value = rule.description || '';
                document.getElementById('ruleActive').checked = rule.active;
            }
        }

        async function deleteRule(id) {
            if (confirm('Bạn chắc chắn muốn xóa quy tắc này?')) {
                config.bettingRules = config.bettingRules.filter(r => r.id !== id);
                await saveConfigToServer();
                renderRules();
            }
        }

        async function addOrUpdateRule() {
            const id = document.getElementById('editRuleId').value || 'rule_' + Date.now();
            const name = document.getElementById('ruleName').value.trim();
            const patternStr = document.getElementById('rulePattern').value.trim();
            const betOn = document.getElementById('ruleBetOn').value;
            const priority = parseInt(document.getElementById('rulePriority').value) || 10;
            const betAmount = parseInt(document.getElementById('ruleBetAmount').value) || null;
            const description = document.getElementById('ruleDescription').value.trim();
            const active = document.getElementById('ruleActive').checked;

            if (!name) {
                showStatus('Vui lòng điền tên quy tắc!', 'error');
                return;
            }

            const pattern = patternStr ? patternStr.split(',').map(s => s.trim().toUpperCase()) : [];

            const newRule = { id, name, pattern, betOn, priority, active, description, betAmount };

            if (!config.bettingRules) config.bettingRules = [];

            const idx = config.bettingRules.findIndex(r => r.id === id);
            if (idx !== -1) {
                config.bettingRules[idx] = newRule;
            } else {
                config.bettingRules.push(newRule);
            }

            await saveConfigToServer();
            renderRules();
            resetRuleForm();
        }

        function resetRuleForm() {
            document.getElementById('editRuleId').value = '';
            document.getElementById('ruleName').value = '';
            document.getElementById('rulePattern').value = '';
            document.getElementById('ruleBetOn').selectedIndex = 0;
            document.getElementById('rulePriority').value = 10;
            document.getElementById('ruleBetAmount').value = '';
            document.getElementById('ruleDescription').value = '';
            document.getElementById('ruleActive').checked = true;
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusMessage');
            box.textContent = msg;
            box.className = `status-message status-${type}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
