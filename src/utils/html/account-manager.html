<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 Quản Lý Tài Khoản – Play Club</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #121824;
            --bg-card: #182235;
            --border: #24344f;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-blue: #0284c7;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --accent-purple: #a855f7;
            --glow: 0 0 15px rgba(2, 132, 199, 0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        /* Header */
        .page-header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-primary));
            border: 1px solid var(--border);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--glow);
        }
        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .page-header p { color: var(--text-secondary); font-size: 0.95rem; }

        .section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .section h2 {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
        }
        .form-group textarea {
            height: 120px;
            resize: vertical;
            font-family: monospace;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: white;
        }
        .btn-success { background: var(--accent-green); }
        .btn-success:hover { background: #16a34a; transform: translateY(-2px); }
        .btn-danger { background: var(--accent-red); }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-warning { background: var(--accent-orange); }
        .btn-warning:hover { background: #ea580c; transform: translateY(-2px); }
        
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }
        .account-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: all 0.3s;
        }
        .account-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--glow);
        }
        .account-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .account-username {
            font-size: 1.15rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .account-game {
            background: rgba(2, 132, 199, 0.2);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(2, 132, 199, 0.4);
        }
        .account-category {
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(168, 85, 247, 0.4);
            margin-top: 6px;
            display: inline-block;
        }
        .account-info {
            margin-bottom: 15px;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .account-info div { margin-bottom: 4px; }
        .account-info strong { color: var(--text-secondary); }

        .account-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .account-actions .btn {
            padding: 8px 16px;
            font-size: 0.8rem;
        }

        .status-message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            display: none;
        }
        .status-success { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
        .status-error { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-number { font-size: 1.8rem; font-weight: 800; color: #38bdf8; }
        .stat-label { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <h1>🔑 Quản Lý Tài Khoản</h1>
            <p>Thiết lập tài khoản đăng nhập cho bot Tài Xỉu</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalAccounts">0</div>
                <div class="stat-label">Tổng Tài Khoản</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeAccounts">0</div>
                <div class="stat-label">Đang Hoạt Động</div>
            </div>
        </div>

        <div class="section">
            <h2>➕ Nhập Tài Khoản Mới</h2>
            <div id="statusMessage" class="status-message"></div>

            <div class="form-group">
                <label for="categoryGame">Loại Trò Chơi:</label>
                <select id="categoryGame" required>
                    <option value="even_odd">🎲 Tài Xỉu (Even/Odd)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="jsonData">Dán Dữ Liệu JSON (Payload Đăng Nhập):</label>
                <textarea id="jsonData" placeholder='Dán payload dạng: [1, "MiniGame", "username", "password", {"info": {...}, "signature": "..."}]'></textarea>
            </div>

            <button class="btn btn-success" onclick="addAccountFromJson()">➕ Thêm Tài Khoản</button>
            <button class="btn btn-danger" onclick="clearAllAccounts()">🗑️ Xóa Tất Cả</button>
        </div>

        <div class="section">
            <h2>👥 Danh Sách Tài Khoản</h2>
            <div id="accountsList" class="accounts-grid">
                <!-- Danh sách load bằng JS -->
            </div>
        </div>
    </div>

    <script>
        let accounts = [];
        const API_BASE = 'http://localhost:3000/api/config';

        document.addEventListener('DOMContentLoaded', () => {
            loadAccounts();
        });

        async function loadAccounts() {
            try {
                const res = await fetch(`${API_BASE}/account`);
                if (res.ok) {
                    accounts = await res.json();
                    if (!Array.isArray(accounts)) accounts = [];
                    displayAccounts();
                    updateStats();
                }
            } catch (err) {
                showStatus('Lỗi kết nối API: ' + err.message, 'error');
            }
        }

        async function saveAccounts() {
            try {
                const res = await fetch(`${API_BASE}/account`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(accounts)
                });
                if (res.ok) {
                    return true;
                }
                throw new Error('Lỗi server');
            } catch (err) {
                showStatus('Lỗi lưu tài khoản: ' + err.message, 'error');
                return false;
            }
        }

        async function addAccountFromJson() {
            const jsonData = document.getElementById('jsonData').value.trim();
            const categoryGame = document.getElementById('categoryGame').value;

            if (!categoryGame) {
                showStatus('Vui lòng chọn loại trò chơi trước!', 'error');
                return;
            }
            if (!jsonData) {
                showStatus('Vui lòng nhập JSON payload!', 'error');
                return;
            }

            try {
                const data = JSON.parse(jsonData);
                let accountsToAdd = [];
                if (Array.isArray(data)) {
                    if (data.length > 0 && Array.isArray(data[0])) {
                        accountsToAdd = data;
                    } else if (data.length >= 5) {
                        accountsToAdd = [data];
                    }
                }

                if (accountsToAdd.length === 0) {
                    showStatus('Định dạng JSON không hợp lệ!', 'error');
                    return;
                }

                let added = 0;
                let updated = 0;

                accountsToAdd.forEach(arr => {
                    if (!Array.isArray(arr) || arr.length < 5) return;
                    const username = arr[2];
                    
                    const idx = accounts.findIndex(acc => acc[2] === username && acc[4]?.categoryGame === categoryGame);
                    
                    if (!arr[4]) arr[4] = {};
                    arr[4].categoryGame = categoryGame;
                    if (arr[4].isActive === undefined) arr[4].isActive = false;

                    if (idx !== -1) {
                        const wasActive = accounts[idx][4]?.isActive || false;
                        accounts[idx] = arr;
                        accounts[idx][4].isActive = wasActive;
                        accounts[idx][4].categoryGame = categoryGame;
                        updated++;
                    } else {
                        accounts.push(arr);
                        added++;
                    }
                });

                await saveAccounts();
                displayAccounts();
                updateStats();
                showStatus(`Đã thêm ${added} và cập nhật ${updated} tài khoản!`, 'success');

                document.getElementById('jsonData').value = '';
                document.getElementById('categoryGame').value = '';
            } catch (err) {
                showStatus('Lỗi phân tích JSON: ' + err.message, 'error');
            }
        }

        async function toggleActive(username, categoryGame) {
            const idx = accounts.findIndex(acc => acc[2] === username && acc[4]?.categoryGame === categoryGame);
            if (idx !== -1) {
                const currentStatus = accounts[idx][4]?.isActive || false;
                
                if (!currentStatus) {
                    // Tắt các tài khoản khác cùng categoryGame
                    accounts.forEach(acc => {
                        if (acc[4] && acc[4].categoryGame === categoryGame) {
                            acc[4].isActive = false;
                        }
                    });
                    accounts[idx][4].isActive = true;
                } else {
                    accounts[idx][4].isActive = false;
                }

                await saveAccounts();
                displayAccounts();
                updateStats();
            }
        }

        async function deleteAccount(username, categoryGame) {
            if (confirm(`Bạn chắc chắn muốn xóa tài khoản "${username}" cho game "${categoryGame}"?`)) {
                accounts = accounts.filter(acc => !(acc[2] === username && acc[4]?.categoryGame === categoryGame));
                await saveAccounts();
                displayAccounts();
                updateStats();
                showStatus('Đã xóa tài khoản!', 'success');
            }
        }

        async function clearAllAccounts() {
            if (confirm('Bạn chắc chắn muốn xóa TẤT CẢ tài khoản?')) {
                accounts = [];
                await saveAccounts();
                displayAccounts();
                updateStats();
                showStatus('Đã xóa toàn bộ tài khoản!', 'success');
            }
        }

        function displayAccounts() {
            const list = document.getElementById('accountsList');
            if (accounts.length === 0) {
                list.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">Chưa có tài khoản nào được cấu hình.</p>';
                return;
            }

            list.innerHTML = accounts.map(arr => {
                const gameType = arr[1];
                const username = arr[2];
                const info = arr[4] || {};
                const isActive = info.isActive || false;
                const categoryGame = info.categoryGame || 'even_odd';

                let displayName = username;
                try {
                    const parsed = typeof info.info === 'string' ? JSON.parse(info.info) : info.info;
                    if (parsed && parsed.displayName) displayName = parsed.displayName;
                } catch (e) {}

                const border = isActive ? '2px solid var(--accent-green)' : '1px solid var(--border)';
                const statusLabel = isActive ? 'ĐANG CHỌN (ACTIVE)' : 'Tạm dừng';
                const statusColor = isActive ? 'var(--accent-green)' : 'var(--text-secondary)';

                return `
                    <div class="account-card" style="border: ${border}">
                        <div class="account-header">
                            <div class="account-username">${displayName}</div>
                            <span class="account-game">${gameType}</span>
                        </div>
                        <div class="account-info">
                            <div><strong>Username:</strong> ${username}</div>
                            <div><strong>Trò chơi:</strong> <span class="account-category">Tài Xỉu</span></div>
                            <div><strong>Trạng thái:</strong> <span style="color: ${statusColor}; font-weight: 600;">${statusLabel}</span></div>
                        </div>
                        <div class="account-actions">
                            <button class="btn btn-warning" onclick="toggleActive('${username}', '${categoryGame}')">${isActive ? '⏸️ Deactivate' : '⭐ Set Active'}</button>
                            <button class="btn btn-danger" onclick="deleteAccount('${username}', '${categoryGame}')">🗑️ Xóa</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStats() {
            document.getElementById('totalAccounts').textContent = accounts.length;
            document.getElementById('activeAccounts').textContent = accounts.filter(acc => acc[4]?.isActive).length;
        }

        function showStatus(msg, type) {
            const box = document.getElementById('statusMessage');
            box.textContent = msg;
            box.className = `status-message status-${type}`;
            box.style.display = 'block';
            setTimeout(() => { box.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
